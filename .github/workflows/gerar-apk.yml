name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk OuvirMelhor.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: OuvirMelhor-apk
          path: OuvirMelhor.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ouvir Melhor 1.0.${{ github.run_number }}
          body: Baixe o arquivo OuvirMelhor.apk abaixo e instale no celular.
          files: OuvirMelhor.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.ouvirmelhor'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.ouvirmelhor'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Chave fixa: assim cada nova versão instala por cima da anterior.
    signingConfigs {
        teste {
            storeFile file('assinatura-teste.keystore')
            storePassword 'android'
            keyAlias 'ouvirmelhor'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.teste
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.teste
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
